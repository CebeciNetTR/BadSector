global
    log stdout format raw local0
    maxconn 100000
    nbthread 4
    tune.h2.max-concurrent-streams 20
    lua-load /usr/local/etc/haproxy/lua/ban_check.lua
    # Admin socket: restart gerektirmeden canli "set map" ile site bazli esik degistirmek icin.
    # Kullanim: scripts/haproxy-site-limit.sh
    stats socket /var/run/haproxy/admin.sock mode 660 level admin

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  15s
    timeout server  30s
    timeout http-request 2s

frontend fe_http
    bind *:80
    acl acme path_beg /.well-known/acme-challenge/
    http-request redirect scheme https code 301 unless acme
    use_backend be_engine if acme

frontend fe_https
    bind *:443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
    maxconn 10000
    option http-ignore-probes
    option http-server-close

    # Track concurrent connections and HTTP request rates per client IP
    stick-table type ip size 1m expire 5m store conn_cur,http_req_rate(10s)
    tcp-request connection track-sc0 src

    # Baseline (attack mode'dan BAGIMSIZ, her zaman acik): ayni IP'den > 8
    # eszamanli baglanti = baglanti taskini/slowloris korumasi. Ucuz, surekli.
    tcp-request connection reject if { sc_conn_cur(0) gt 8 }

    # ban_check.lua'yi ONCE calistir: txn.bs_attack_mode (ve banli ise txn.bs_banned)
    # degiskenlerini set eder. Asagidaki 429 limiti bu bayraga gore uygulanir.
    http-request lua.ban_check
    http-request silent-drop if { var(txn.bs_banned) -m bool }

    # ATTACK MODE limitleme: sadece attack mode ACIKKEN HAProxy edge rate-limit'i
    # uygular. Kapaliyken bu blok atlanir ve motorun ince rate_limiter modulu devreye
    # girer (path/method/profil bazli).
    #   - site-ratelimit.map: host icin ozel esik yoksa varsayilan 20 (istek/10s)
    #   - map degeri -1 => bu host HAProxy limitinden muaf
    #   - Restart'siz guncelleme: scripts/haproxy-site-limit.sh
    http-request set-var(txn.req_limit) req.hdr(host),lower,map_str_int(/usr/local/etc/haproxy/maps/site-ratelimit.map,20)
    http-request set-var(txn.req_rate) sc_http_req_rate(0)
    acl attack_on var(txn.bs_attack_mode) -m bool
    acl ratelimit_bypass var(txn.req_limit) -m int eq -1
    acl rate_abuse var(txn.req_limit),sub(txn.req_rate) lt 0

    # EDGE FAST-PATH: PoW'u cozup imzali "gecis" cookie'si (bs_pass) alan istemciler
    # attack-mode 429'undan muaf tutulur. Bu SADECE bir hizli-yol ipucudur — cookie'nin
    # KRIPTOGRAFIK dogrulamasi motorda (stateless HMAC) yapilir. Sahte bs_pass yollayan
    # saldirgan motora ulasir, orada reddedilir; cozemezse js_challenge auto-ban'i
    # devreye girer ve IP banlanip yukarida (silent-drop) edge'de dusurulur. Yani
    # kotuye kullanim IP basina birkac istekle sinirli, kendini-duzeltir.
    acl has_pass req.cook(bs_pass) -m found

    # 429 yalnizca attack acikken, host muaf degilken, rate asilmisken VE gecis
    # cookie'si yokken tetiklenir.
    http-request deny deny_status 429 if attack_on !ratelimit_bypass rate_abuse !has_pass

    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Client-Proto %[req.ver]
    default_backend be_engine

backend be_engine
    option httpchk GET /badsector/health
    http-check expect status 200
    option forwardfor
    http-request set-header X-Real-IP %[src]
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-reuse safe
    server engine engine:8080 check inter 3s fall 3 rise 2

    # Engine "drop" karari (banli IP / bilinmeyen site / 444 kurali) icin motor,
    # X-BadSector-Drop:1 header'li kucuk bir yanit doner. Burada baglantiyi sessizce
    # dusururuz: istemciye HICBIR sey gitmez (ngx.exit(444)'un aksine 502 uretmez) ve
    # HAProxy hicbir kaynak tutmaz. Saldirganin baglantisi sonsuza dek acik "gorunur".
    http-response silent-drop if { res.hdr(X-BadSector-Drop) -m found }
