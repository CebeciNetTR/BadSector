global
    # local0 notice: SSL handshake timeout/fail loglari flood'da CPU yer (Idle_pct=0).
    # err/alert kalir; binlerce "Timeout during SSL handshake" satirini yazma.
    log stdout format raw local0 notice
    # OVH 8c / 24GB / ~3Gbps: daha yuksek eszamanli TLS. RAM/CPU buna gore.
    maxconn 100000
    nbthread 8
    # H2 flood: tek baglantida cok stream. 32 → 16 (CPU/buffer).
    tune.h2.max-concurrent-streams 16
    # Yarim kalan TLS'i hizla dusur (slowloris / handshake flood).
    tune.ssl.lifetime 300
    lua-load /usr/local/etc/haproxy/lua/ban_check.lua
    # Admin socket: restart gerektirmeden canli "set map" ile site bazli esik degistirmek icin.
    # Kullanim: scripts/haproxy-site-limit.sh
    stats socket /var/run/haproxy/admin.sock mode 660 level admin

defaults
    mode http
    log global
    # httplog kapali: her istek logu + SSL fail logu = TLS flood'da olum dongusu.
    # Gerektiginde: option httplog
    timeout connect 3s
    # Handshake bu sureye dahil; 10s yarim baglanti biriktiriyordu → 4s.
    timeout client  4s
    timeout server  20s
    timeout http-request 2s
    timeout http-keep-alive 3s
    timeout client-fin 1s

frontend fe_http
    bind *:80
    acl acme path_beg /.well-known/acme-challenge/
    http-request redirect scheme https code 301 unless acme
    use_backend be_engine if acme

frontend fe_https
    bind *:443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
    # 50k teorik; Idle=0 iken 13k conn CPU'yu oldurur. Tavan dusuk = meşru TLS'e yer.
    # Canli: echo "set maxconn frontend fe_https 3000" | socat ...
    maxconn 8000
    option http-ignore-probes
    option http-server-close

    # Track concurrent connections and HTTP request rates per client IP
    stick-table type ip size 2m expire 5m store conn_cur,http_req_rate(10s)
    tcp-request connection track-sc0 src

    # Baseline: IP basina eszamanli TCP. Flood'ta 32 bile cok; 12 + frontend maxconn.
    tcp-request connection reject if { sc_conn_cur(0) gt 12 }

    # ban_check.lua'yi ONCE calistir: txn.bs_attack_mode (ve banli ise txn.bs_banned)
    http-request lua.ban_check
    http-request silent-drop if { var(txn.bs_banned) -m bool }

    # ATTACK MODE edge rate-limit (kapaliyken motor rate_limiter).
    # Varsayilan 80/10s: gercek sayfa (css/js/img) ~20'de 429 yiyordu → "site yavas".
    # Flood IP'ler yine 80'i asar; ban/watcher iptables'a duser.
    #   map -1 => host muaf | canli: scripts/haproxy-site-limit.sh
    http-request set-var(txn.req_limit) req.hdr(host),lower,map_str_int(/usr/local/etc/haproxy/maps/site-ratelimit.map,80)
    http-request set-var(txn.req_rate) sc_http_req_rate(0)
    acl attack_on var(txn.bs_attack_mode) -m bool
    acl ratelimit_bypass var(txn.req_limit) -m int eq -1
    acl rate_abuse var(txn.req_limit),sub(txn.req_rate) lt 0

    # EDGE FAST-PATH: imzali bs_pass cookie → attack rate-limit muaf.
    acl has_pass req.cook(bs_pass) -m found

    # Abuse: 429 yerine silent-drop (yanit uretme / log yok → CPU dusuk).
    # bs_pass olanlar ve limit altindakiler engine'e gider.
    http-request set-log-level silent if attack_on !ratelimit_bypass rate_abuse !has_pass
    http-request silent-drop if attack_on !ratelimit_bypass rate_abuse !has_pass

    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Client-Proto %[req.ver]
    default_backend be_engine

backend be_engine
    option httpchk GET /badsector/health
    http-check expect status 200
    # BEGIN_CLIENT_IP_POLICY
    http-request del-header CF-Connecting-IP
    http-request del-header True-Client-IP
    http-request del-header X-Client-IP
    http-request del-header X-Forwarded-For
    http-request set-header X-Real-IP %[src]
    option forwardfor
    # END_CLIENT_IP_POLICY
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-reuse safe
    server engine engine:8080 check inter 3s fall 3 rise 2

    # Engine "drop" karari → sessiz dusur (502 yok).
    http-response silent-drop if { res.hdr(X-BadSector-Drop) -m found }
