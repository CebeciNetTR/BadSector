global
    log stdout format raw local0
    maxconn 50000

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  60s
    timeout server  60s

frontend fe_http
    bind *:9080
    default_backend be_engine

backend be_engine
    option httpchk GET /badsector/health
    http-check expect status 200
    server engine engine:8080 check inter 3s fall 3 rise 2
