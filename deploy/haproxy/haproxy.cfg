global
    log stdout format raw local0
    maxconn 100000

    # Stick tables for connection-level affinity
    stick-table type ip size 1m expire 30m

defaults
    mode tcp
    timeout connect 5s
    timeout client  60s
    timeout server  60s

frontend fe_https
    bind *:443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
    bind *:8443 quic4 ssl crt /etc/haproxy/certs/ alpn h3

    # Connection limits per source IP
    stick-table type ip size 1m expire 10m store conn_cur,conn_rate(10s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc_conn_cur(0) gt 1000 }

    default_backend be_openresty

backend be_openresty
    mode tcp
    balance leastconn
    server openresty1 badsector-engine:8080 check
