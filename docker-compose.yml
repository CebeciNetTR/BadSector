services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 8c/24GB (OVH): rate sayaclari + ban + PoW/trace TTL'li; allkeys-lru guvenli.
    command: ["redis-server", "--maxmemory", "2gb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      # SADECE localhost — Redis internete ACIK OLMAMALI (sifre yok; disaridan
      # FLUSHALL/CONFIG suistimali + RCE riski). Watcher host'tan 127.0.0.1:6379
      # kullandigi icin publish localhost'ta kaliyor. Diger servisler docker
      # network'unden "redis" servis adiyla erisir (port publish'e ihtiyac yok).
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: badsector
      POSTGRES_PASSWORD: badsector
      POSTGRES_DB: badsector
    # 8c/24GB: config-agirlikli API; yazma trafigi dusuk.
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=100
    ports:
      # SADECE localhost — Postgres internete acik olmamali.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badsector"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      BADSECTOR_API_ADDR: ":8080"
      BADSECTOR_DATABASE_URL: "postgres://badsector:badsector@postgres:5432/badsector?sslmode=disable"
      BADSECTOR_RUNTIME: /runtime
      BADSECTOR_REDIS_URL: "redis://redis:6379"
      BADSECTOR_AUTH_DISABLED: ${BADSECTOR_AUTH_DISABLED:-false}
      BADSECTOR_JWT_SECRET: ${BADSECTOR_JWT_SECRET:-badsector-dev-secret-change-me}
      BADSECTOR_ADMIN_USER: ${BADSECTOR_ADMIN_USER:-admin}
      BADSECTOR_ADMIN_PASSWORD: ${BADSECTOR_ADMIN_PASSWORD:-badsector}
      BADSECTOR_DEFAULT_BACKEND_URL: "http://backend:80"
      BADSECTOR_ENGINE_RELOAD_URL: "http://engine:8080/badsector/admin/reload"
      BADSECTOR_GEOIP_PATH: /data/geoip
      BADSECTOR_BOTS_PATH: /data/bots
      BADSECTOR_CERTS_PATH: /data/certs
      BADSECTOR_CHALLENGE_DIR: /data/challenge
      BADSECTOR_RESTORE_DIR: /data/restore
      BADSECTOR_ACME_EMAIL: ${BADSECTOR_ACME_EMAIL:-}
      BADSECTOR_ACME_STAGING: ${BADSECTOR_ACME_STAGING:-false}
      BADSECTOR_CLOUDFLARE: ${BADSECTOR_CLOUDFLARE:-false}
      BADSECTOR_TRUSTED_IPS: ${BADSECTOR_TRUSTED_IPS:-}
      BADSECTOR_CHALLENGE_SECRET: ${BADSECTOR_CHALLENGE_SECRET:-badsector-dev-challenge-secret-change-me}
      BADSECTOR_ENGINE_ADMIN_TOKEN: ${BADSECTOR_ENGINE_ADMIN_TOKEN:-badsector-engine-token}
    ports:
      # SADECE localhost — API'ye tarayici, ui nginx uzerinden (/api proxy) erisir;
      # disaridan dogrudan 8080'e erisime gerek yok.
      - "127.0.0.1:8080:8080"
    volumes:
      - runtime_config:/runtime
      - api_data:/data
      - ./data/geoip:/data/geoip:ro
      - ./data/bots:/data/bots:ro
      - ./data/certs:/data/certs
      - ./data/challenge:/data/challenge
      - ./data/restore:/data/restore
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      BADSECTOR_REDIS_HOST: redis
      BADSECTOR_REDIS_PORT: "6379"
      BADSECTOR_REDIS_TIMEOUT: "100"
      BADSECTOR_RUNTIME: /etc/badsector/runtime
      BADSECTOR_ENGINE_ADMIN_TOKEN: ${BADSECTOR_ENGINE_ADMIN_TOKEN:-badsector-engine-token}
      BADSECTOR_TRACE_BUFFER_SIZE: "100"
      # Trusted bot rDNS dogrulamasi icin DNS resolver (Docker embedded DNS).
      BADSECTOR_DNS_RESOLVER: "127.0.0.11"
      # Worker'in yazdigi resmi bot IP aralik dosyasi (Googlebot/Bingbot).
      BADSECTOR_BOTS_PATH: /etc/badsector/bots
      # Imzali PoW challenge HMAC anahtari — URETIMDE MUTLAKA DEGISTIRIN.
      # Tum engine worker'lari ayni sirri paylasmali (token'lar stateless dogrulanir).
      BADSECTOR_CHALLENGE_SECRET: ${BADSECTOR_CHALLENGE_SECRET:-badsector-dev-challenge-secret-change-me}
      # PoW zorlugu (basta hex sifir): normal / attack mode.
      BADSECTOR_POW_DIFFICULTY: "4"
      BADSECTOR_POW_DIFFICULTY_ATTACK: "5"
      # Tum siteler icin ortak challenge HTML (site template bosken). Git'e girmeyen host dosyasi.
      BADSECTOR_JS_CHALLENGE_TEMPLATE_PATH: /etc/badsector/challenge/template.html
      # Virgul ile yonetim IP'leri — ban/GeoIP/challenge muaf (.env: BADSECTOR_TRUSTED_IPS)
      BADSECTOR_TRUSTED_IPS: ${BADSECTOR_TRUSTED_IPS:-}
      # false = edge (spoof kapali). Cloudflare arkasi: true
      BADSECTOR_CLOUDFLARE: ${BADSECTOR_CLOUDFLARE:-false}
    volumes:
      - runtime_config:/etc/badsector/runtime:ro
      - ./data/geoip:/etc/badsector/geoip:ro
      - ./engine/scripts:/etc/badsector/scripts:ro
      - ./data/bots:/etc/badsector/bots:ro
      - ./data/challenge:/etc/badsector/challenge:ro
      - ./engine/coraza/rules:/etc/badsector/coraza/rules:ro
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/badsector/health"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  haproxy:
    build:
      context: ./deploy/haproxy
      dockerfile: Dockerfile
      args:
        HAPROXY_CONFIG: ${BADSECTOR_HAPROXY_CONFIG:-dev}
    restart: unless-stopped
    environment:
      HAPROXY_CONFIG: ${BADSECTOR_HAPROXY_CONFIG:-dev}
      BADSECTOR_REDIS_HOST: redis
      BADSECTOR_REDIS_PORT: "6379"
      BADSECTOR_TRUSTED_IPS: ${BADSECTOR_TRUSTED_IPS:-}
      BADSECTOR_CLOUDFLARE: ${BADSECTOR_CLOUDFLARE:-false}
    ports:
      - "9080:9080"
      - "80:80"
      - "443:443"
    volumes:
      - ./data/certs/haproxy:/etc/haproxy/certs:ro
      - ./data/haproxy:/usr/local/etc/haproxy/maps
    ulimits:
      nofile:
        soft: 300000
        hard: 300000
    depends_on:
      engine:
        condition: service_healthy
    sysctls:
      - net.ipv4.tcp_tw_reuse=1
      - net.ipv4.tcp_fin_timeout=10
      - net.core.somaxconn=65535
      - net.ipv4.tcp_max_syn_backlog=65535
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  watcher:
    build:
      context: .
      dockerfile: deploy/watcher/Dockerfile
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      BADSECTOR_REDIS_HOST: "127.0.0.1"
      BADSECTOR_REDIS_PORT: "6379"
      BAN_THRESHOLD: "300"        # attack altinda daha hizli iptables (eskiden 1000)
      CHECK_INTERVAL: "15"        # daha sik ban/prune
      KERNEL_SYNC_INTERVAL: "120" # bs:ban SCAN/ipset test (yeni ban yoksa seyrek)
      KERNEL_SYNC_INTERVAL_IDLE: "900" # son sync 0 ekleme → 15 dk
      PRUNE_INTERVAL: "60"
      BAN_TTL: "7200"             # 2 saat ban (yanlis ban / SSH kilidi riskini dusurur)
      HIT_STALE_SEC: "600"        # 10dk+ gorulmeyen
      HIT_MIN_KEEP: "10"          # stale + hit<10 → bs:ip_hits prune
      BADSECTOR_TRUSTED_IPS: ${BADSECTOR_TRUSTED_IPS:-}
      # Kernel attack geo (ipset CIDR) — Redis bs:attack_kernel_* yoksa fallback
      ATTACK_KERNEL_COUNTRIES: ${ATTACK_KERNEL_COUNTRIES:-}
      ATTACK_KERNEL_ASNS: ${ATTACK_KERNEL_ASNS:-}
      ATTACK_KERNEL_ALLOW_COUNTRIES: ${ATTACK_KERNEL_ALLOW_COUNTRIES:-TR}
      ATTACK_KERNEL_EXEMPT_COUNTRIES: ${ATTACK_KERNEL_EXEMPT_COUNTRIES:-TR}
      BADSECTOR_ASN_MMDB: /etc/badsector/geoip/GeoLite2-ASN.mmdb
      ATTACK_ASN_HIT_MIN: "1"
      ATTACK_ASN_SCAN_LIMIT: "8000"
    volumes:
      - ./data/geoip:/etc/badsector/geoip:ro
      - ./data/watcher:/var/lib/badsector
    depends_on:
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      # Demo backend — sadece localhost.
      - "127.0.0.1:8081:80"

  ui:
    restart: unless-stopped
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    ports:
      # Admin panel. Host portu .env'den BADSECTOR_UI_PORT ile degistirilebilir
      # (varsayilan 3000). Ic port sabit 3000. Ornek: BADSECTOR_UI_PORT=8443
      # Not: port degistirmek "gizleme"dir; asil guvenlik firewall/SSH tunnel.
      - "${BADSECTOR_UI_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      BADSECTOR_DATABASE_URL: "postgres://badsector:badsector@postgres:5432/badsector?sslmode=disable"
      BADSECTOR_RUNTIME: /runtime
      BADSECTOR_REDIS_URL: "redis://redis:6379"
      BADSECTOR_DEFAULT_BACKEND_URL: "http://backend:80"
      BADSECTOR_ENGINE_RELOAD_URL: "http://engine:8080/badsector/admin/reload"
      BADSECTOR_ENGINE_ADMIN_TOKEN: ${BADSECTOR_ENGINE_ADMIN_TOKEN:-badsector-engine-token}
      BADSECTOR_GEOIP_PATH: /data/geoip
      BADSECTOR_GEOIP_SYNC_INTERVAL: "24h"
      BADSECTOR_BOTS_PATH: /data/bots
      BADSECTOR_BOT_SYNC_INTERVAL: "24h"
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
      BADSECTOR_CERTS_PATH: /data/certs
      BADSECTOR_ACME_EMAIL: ${BADSECTOR_ACME_EMAIL:-}
      BADSECTOR_ACME_STAGING: ${BADSECTOR_ACME_STAGING:-false}
      BADSECTOR_CERT_RENEW_INTERVAL: "6h"
    volumes:
      - runtime_config:/runtime
      - ./data/geoip:/data/geoip
      - ./data/bots:/data/bots
      - ./data/certs:/data/certs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  redis_data:
  postgres_data:
  runtime_config:
  api_data:
