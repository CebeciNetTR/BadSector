daemon off;
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format badsector '$badsector_client_ip ($remote_addr) - $request_id [$time_local] '
                         'host="$http_host" "$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         'rt=$request_time';

    access_log /dev/stdout badsector;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Docker embedded DNS — required for variable proxy_pass hostnames
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Lua package path
    lua_package_path "/usr/local/openresty/badsector/lib/?.lua;/usr/local/openresty/badsector/lib/?/init.lua;;";
    lua_code_cache on;

    # Shared memory for hot config and counters
    lua_shared_dict badsector_config 10m;
    lua_shared_dict badsector_counters 50m;
    lua_shared_dict badsector_challenges 10m;

    init_worker_by_lua_block {
        local badsector = require("badsector.init")
        badsector.init_worker()
    }

    map $http_x_forwarded_proto $badsector_forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        listen 8080;
        server_name _;

        set $badsector_backend http://backend:80;
        set $badsector_country "";
        set $badsector_geo_city "";
        set $badsector_geo_asn "";
        set $badsector_geo_asn_org "";
        set $badsector_client_ip "";
        set $badsector_geo_status "";
        set $badsector_geo_error "";
        set $badsector_edge "";
        access_by_lua_block {
            local badsector = require("badsector.init")
            badsector.handle()
        }

        location / {
            proxy_pass $badsector_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $badsector_client_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $badsector_forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-BadSector-Edge $badsector_edge;
            proxy_set_header X-Geo-Status $badsector_geo_status;
            proxy_set_header X-Geo-Error $badsector_geo_error;
            proxy_set_header X-BadSector-Client-IP $badsector_client_ip;
            proxy_set_header X-Country-Code $badsector_country;
            proxy_set_header X-Geo-Country $badsector_country;
            proxy_set_header X-Geo-City $badsector_geo_city;
            proxy_set_header X-Geo-ASN $badsector_geo_asn;
            proxy_set_header X-Geo-ASN-Org $badsector_geo_asn_org;
        }

        location ^~ /.well-known/acme-challenge/ {
            access_by_lua_block { return }
            access_log off;
            content_by_lua_block {
                local acme = require("badsector.acme")
                acme.serve()
            }
        }

        location /badsector/health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /badsector/admin/reload {
            access_log off;
            content_by_lua_block {
                local badsector = require("badsector.init")
                badsector.admin_reload()
            }
        }
    }
}