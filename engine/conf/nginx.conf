worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 65535;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format badsector '$remote_addr - $request_id [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         'rt=$request_time';

    access_log /var/log/nginx/access.log badsector;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Docker embedded DNS — required for variable proxy_pass hostnames
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Lua package path
    lua_package_path "/usr/local/openresty/badsector/lib/?.lua;/usr/local/openresty/badsector/lib/?/init.lua;;";
    lua_code_cache on;

    # Shared memory for hot config and counters
    lua_shared_dict badsector_config 10m;
    lua_shared_dict badsector_counters 50m;
    lua_shared_dict badsector_challenges 10m;

    init_worker_by_lua_block {
        local badsector = require("badsector.init")
        badsector.init_worker()
    }

    server {
        listen 8080;
        server_name _;

        set $request_id $request_id;
        set $badsector_backend http://backend:80;

        access_by_lua_block {
            local badsector = require("badsector.init")
            badsector.handle()
        }

        location / {
            proxy_pass $badsector_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location ^~ /.well-known/acme-challenge/ {
            access_log off;
            content_by_lua_block {
                local acme = require("badsector.acme")
                acme.serve()
            }
        }

        location /badsector/health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location = /badsector/admin/reload {
            access_log off;
            content_by_lua_block {
                local badsector = require("badsector.init")
                badsector.admin_reload()
            }
        }
    }
}
