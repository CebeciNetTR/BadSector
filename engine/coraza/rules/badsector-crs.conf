# BadSector dev CRS rules — mounted into engine at /etc/badsector/coraza/rules
# Format: RULE id=<id> level=<1-4> msg="<text>" pattern=<lua pattern>

RULE id=942110 level=1 msg="SQLi comment injection" pattern=/%[%s]*or[%s]+1[%s]*=[%s]*1
RULE id=941110 level=1 msg="XSS event handler" pattern=on[%w]+[%s]*=
RULE id=930110 level=1 msg="Path traversal encoded" pattern=%%2e%%2e[%/]
RULE id=920460 level=2 msg="Suspicious file extension" pattern=%.%exe[%s%?]
RULE id=932110 level=2 msg="Shell command in query" pattern=(;[%s]*|%||%&)[%s]*(wget|curl|bash|powershell)
